<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#16212e"/><stop offset="1" stop-color="#9d7261"/></linearGradient>
<linearGradient id="water" x2="0" y2="1"><stop stop-color="#22636d"/><stop offset="1" stop-color="#071923"/></linearGradient>
